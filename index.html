<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmable Rule-Based AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        
        .code-font {
            font-family: 'Fira Code', monospace;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        .tab-active {
            background-color: #1e293b;
            border-left: 4px solid #0ea5e9;
            color: #0ea5e9;
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden bg-slate-900 justify-center">

    <!-- Main Content Area (Clean Chat Interface) -->
    <main class="flex flex-col h-full w-full max-w-4xl bg-slate-800 shadow-2xl border-x border-slate-700">
        
        <header class="p-4 md:p-6 border-b border-slate-700 bg-slate-900 shadow-sm flex justify-between items-center">
            <div>
                <h2 class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
                    <i class="fa-solid fa-microchip mr-2 text-cyan-400"></i> Programmable AI
                </h2>
                <p class="text-sm text-slate-400 mt-1">Rules are loaded directly from <code class="text-cyan-300 bg-slate-800 px-1 rounded">engine.js</code>.</p>
            </div>
        </header>

        <div id="chat-history" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 flex flex-col">
            <!-- Welcome Message -->
            <div class="flex items-start max-w-[85%]">
                <div class="bg-cyan-600/20 border border-cyan-500/30 p-3 rounded-2xl rounded-tl-none text-slate-200 shadow-sm">
                    Hello! Try asking me to "calculate 5 * 5" or just say "hello".
                </div>
            </div>
        </div>
        
        <div class="p-4 bg-slate-900 border-t border-slate-800">
            <form id="chat-form" class="flex gap-2 mx-auto">
                <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all" autocomplete="off">
                <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white px-6 py-3 rounded-lg font-medium transition-colors flex items-center gap-2">
                    <span>Send</span>
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- Load external rules file first -->
    <script src="engine.js"></script>
    <script>
        /**
         * =========================================================================
         * 🧠 CORE ENGINE (Data is now loaded directly from engine.js)
         * =========================================================================
         */
        
        // Chat UI Handling
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatHistory = document.getElementById('chat-history');

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value;
            if(!text.trim()) return;

            // Add User message
            appendMessage(text, 'user');
            chatInput.value = '';

            // Process AI Response
            setTimeout(() => {
                const responseObj = processInput(text);
                appendMessage(responseObj.text, 'ai', responseObj.metadata);
            }, 300); // Tiny simulated delay
        });

        function appendMessage(text, sender, metadata = '') {
            const div = document.createElement('div');
            div.className = `flex flex-col max-w-[85%] ${sender === 'user' ? 'self-end items-end' : 'self-start items-start'} mt-2`;
            
            const bubble = document.createElement('div');
            if (sender === 'user') {
                bubble.className = 'bg-blue-600 text-white p-3 rounded-2xl rounded-tr-none shadow-sm';
            } else {
                bubble.className = 'bg-slate-700 border border-slate-600 text-slate-100 p-3 rounded-2xl rounded-tl-none shadow-sm';
            }
            bubble.textContent = text;
            div.appendChild(bubble);

            if (metadata && sender === 'ai') {
                const meta = document.createElement('span');
                meta.className = 'text-[10px] text-slate-500 mt-1 ml-1 font-mono uppercase';
                meta.textContent = metadata;
                div.appendChild(meta);
            }

            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        /**
         * 🚀 The actual AI logic flow: Strict -> Coded -> Modifiers
         */
        function processInput(userInput) {
            let finalResponse = null;
            let ruleTypeUsed = null;
            let ruleNameUsed = null;
            
            const rawInput = userInput.trim();
            const lowerInput = rawInput.toLowerCase();

            // Ensure AI_RULES is loaded from engine.js
            if (typeof AI_RULES === 'undefined') {
                return { text: "Error: engine.js is missing or not loading properly.", metadata: "System Error" };
            }

            // 1. Check STRICT RULES first
            for (let rule of AI_RULES.strict) {
                if (rule.triggers.some(t => lowerInput.includes(t.toLowerCase().trim()))) {
                    finalResponse = rule.response;
                    ruleTypeUsed = 'Strict Rule';
                    ruleNameUsed = `Trigger: "${rule.triggers[0]}"`;
                    break;
                }
            }

            // 2. If no strict rule matched, check CODED RULES
            if (!finalResponse) {
                for (let rule of AI_RULES.coded) {
                    try {
                        if (rule.match(lowerInput, rawInput)) {
                            finalResponse = rule.process(lowerInput, rawInput);
                            ruleTypeUsed = 'Coded Logic';
                            ruleNameUsed = rule.name;
                            break;
                        }
                    } catch (e) {
                        console.error(`Error in rule [${rule.name}]:`, e);
                    }
                }
            }

            // Fallback if nothing matches
            if (!finalResponse) {
                finalResponse = "I don't have a rule for that yet. Add one in engine.js!";
                ruleTypeUsed = 'System Default';
                ruleNameUsed = 'Fallback';
            }

            // 3. Always apply MODIFIERS to the final response
            for (let mod of AI_RULES.modifiers) {
                try {
                    finalResponse = mod.process(finalResponse);
                } catch (e) {
                    console.error(`Error in modifier [${mod.name}]:`, e);
                }
            }

            return { text: finalResponse, metadata: `${ruleTypeUsed} • ${ruleNameUsed}` };
        }

        // Automatically focus input on load
        window.onload = () => setTimeout(() => chatInput.focus(), 100);
    </script>
</body>
</html>

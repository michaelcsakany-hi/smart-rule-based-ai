<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Rule Engine</title>
</head>
<body>

<h2>Simple Rule Engine</h2>

<input type="text" id="inputBox" placeholder="Type something...">
<button id="runBtn">Run</button>

<p id="output"></p>

<script>

class RuleEngine {
  constructor() {
    this.straightRules = [];
    this.codedRules = [];
    this.modifiers = [];
  }

  addStraight(trigger, response) {
    this.straightRules.push({ trigger, response });
  }

  addCoded(matchFunction, actionFunction) {
    this.codedRules.push({ match: matchFunction, action: actionFunction });
  }

  addModifier(modifierFunction) {
    this.modifiers.push(modifierFunction);
  }

  process(input) {
    input = input.toLowerCase();
    let output = null;

    // Straight rules
    for (const rule of this.straightRules) {
      if (input.includes(rule.trigger.toLowerCase())) {
        output = rule.response;
        break;
      }
    }

    // Coded rules
    if (!output) {
      for (const rule of this.codedRules) {
        if (rule.match(input)) {
          output = rule.action(input);
          break;
        }
      }
    }

    if (!output) {
      output = "No rule matched.";
    }

    // Apply modifiers
    for (const modifier of this.modifiers) {
      output = modifier(output, input);
    }

    return output;
  }
}

// =======================
// Create Engine
// =======================

const engine = new RuleEngine();

// Rules
engine.addStraight("hello", "Hi there!");
engine.addStraight("bye", "Goodbye!");
engine.addStraight("no", "sorry about that");
engine.addStraight("your dumb", "yes i am duh");
engine.addStraight("whats your name", "idk");

engine.addCoded(
  (input) => input.includes("+"),
  (input) => {
    const match = input.match(/(\d+)\s*\+\s*(\d+)/);
    if (!match) return "That looks like math.";
    return "Math result: " + (Number(match[1]) + Number(match[2]));
  }
);
engine.addCoded(
  // Match function: when to trigger
  (input) => input.includes("random number"),
  
  // Action function: what to do
  () => Math.random()
);

// =======================
// Modifiers
// =======================

// Uppercase modifier
engine.addModifier((output, input) => {
  if (input.includes("shout")) {
    return output.toUpperCase();
  }
  return output;
});

// Add emoji modifier
engine.addModifier((output, input) => {
  if (input.includes("with happy emoji")) {
    return output + " 😊";
  }
  return output;
});

// =======================
// UI Hook
// =======================

document.getElementById("runBtn").addEventListener("click", () => {
  const input = document.getElementById("inputBox").value;
  const result = engine.process(input);
  document.getElementById("output").innerText = result;
});

</script>

<script>
  // Pre-built helper functions
  const helpers = {
    contains: (text, word) => text.includes(word),
    startsWith: (text, word) => text.startsWith(word),
    endsWith: (text, word) => text.endsWith(word),
    addNumbers: (text) => {
      const match = text.match(/(\d+)\s*\+\s*(\d+)/);
      if (!match) return null;
      return Number(match[1]) + Number(match[2]);
    }
  };

  // Rule list (easy to add more)
  const rules = [
    {
      match: (input) => helpers.contains(input, "no"),
      action: () => "I'm sorry for doing that."
    },
    {
      match: (input) => helpers.contains(input, "+"),
      action: (input) => {
        const result = helpers.addNumbers(input);
        if (result !== null) {
          return "Math result: " + result;
        }
        return "That looks like math but I can't calculate it.";
      }
    }
  ];

  function processInput() {
    const input = document.getElementById("inputBox").value;
    let output = "No rule matched.";

    for (const rule of rules) {
      if (rule.match(input)) {
        output = rule.action(input);
        break;
      }
    }

    document.getElementById("output").innerText = output;
  }
</script>
